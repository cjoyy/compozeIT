<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">CompozeIT Tech Stack, Database, and System Data Flow</title>
  <desc id="desc">Architecture diagram showing the mobile web app, Next.js API layer, AI vision providers, Supabase database tables, and the B2B waste processing data flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f7ec"/>
      <stop offset="0.45" stop-color="#e3f0d9"/>
      <stop offset="1" stop-color="#cfe7e0"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7d4f"/>
      <stop offset="1" stop-color="#7ca654"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#20432f" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6041"/>
    </marker>
    <style>
      .title { font-family: Inter, Arial, sans-serif; font-size: 48px; font-weight: 700; fill: #1f3a29; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 20px; fill: #496451; }
      .box { fill: rgba(255, 255, 255, 0.88); stroke: #bdd3bc; stroke-width: 2; rx: 20; filter: url(#shadow); }
      .box-title { font-family: Inter, Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #203928; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #254232; }
      .text { font-family: Inter, Arial, sans-serif; font-size: 16px; fill: #405946; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 14px; fill: #536c5b; }
      .pill { fill: #eef6e7; stroke: #bdd7b7; stroke-width: 1.5; rx: 16; }
      .pill-text { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #2f6041; }
      .arrow { fill: none; stroke: #2f6041; stroke-width: 4; marker-end: url(#arrow); }
      .thin-arrow { fill: none; stroke: #6d8f70; stroke-width: 3; marker-end: url(#arrow); }
      .node { fill: #ffffff; stroke: #9fc194; stroke-width: 2; }
      .num { font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
      .num-circle { fill: url(#leaf); }
      .db { fill: #f8fbf3; stroke: #8fb889; stroke-width: 2; rx: 16; }
      .table-title { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #1f3a29; }
      .table-field { font-family: Inter, Arial, sans-serif; font-size: 13px; fill: #405946; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <path d="M1320 58 C1430 84 1502 150 1538 262 C1450 238 1376 171 1320 58 Z" fill="#d7ead2" opacity="0.75"/>
  <path d="M88 760 C196 788 266 862 290 950 C200 918 128 856 88 760 Z" fill="#d7ead2" opacity="0.7"/>
  <path d="M1280 816 C1390 820 1486 860 1540 942 C1436 950 1340 906 1280 816 Z" fill="#bee0c5" opacity="0.58"/>

  <text x="80" y="92" class="title">CompozeIT System Flow</text>
  <text x="82" y="128" class="subtitle">B2B-first waste classification, cashback loop, traceability, and mockup logistics marketplace.</text>

  <rect x="70" y="180" width="370" height="250" class="box"/>
  <text x="105" y="230" class="box-title">Mobile Web UI</text>
  <rect x="105" y="260" width="138" height="34" class="pill"/><text x="123" y="282" class="pill-text">Next.js App</text>
  <rect x="255" y="260" width="132" height="34" class="pill"/><text x="273" y="282" class="pill-text">React UI</text>
  <text x="105" y="326" class="text">Upload photo, dashboard, logistics,</text>
  <text x="105" y="354" class="text">marketplace, compliance, impact,</text>
  <text x="105" y="382" class="text">and business profile pages.</text>

  <rect x="615" y="170" width="370" height="280" class="box"/>
  <text x="650" y="220" class="box-title">API and Logic</text>
  <text x="650" y="264" class="label">Next.js route handlers</text>
  <text x="650" y="296" class="text">/api/waste/classify</text>
  <text x="650" y="322" class="text">/api/pickup/trigger</text>
  <text x="650" y="348" class="text">/api/batch/:id/timeline</text>
  <text x="650" y="374" class="text">/api/cashback/apply</text>
  <text x="650" y="416" class="small">Cashback assumption: estimated kg x Rp1000.</text>

  <rect x="1160" y="180" width="370" height="250" class="box"/>
  <text x="1195" y="230" class="box-title">AI Vision Provider</text>
  <text x="1195" y="270" class="text">Provider abstraction stays in code.</text>
  <rect x="1195" y="300" width="132" height="34" class="pill"/><text x="1215" y="322" class="pill-text">OpenAI</text>
  <rect x="1340" y="300" width="132" height="34" class="pill"/><text x="1360" y="322" class="pill-text">Ollama</text>
  <text x="1195" y="370" class="small">Returns waste type, estimated weight,</text>
  <text x="1195" y="394" class="small">confidence, and contamination status.</text>

  <rect x="70" y="535" width="620" height="360" class="box"/>
  <text x="105" y="585" class="box-title">Supabase Database</text>
  <g transform="translate(105 620)">
    <rect width="245" height="95" class="db"/>
    <text x="18" y="30" class="table-title">users</text>
    <text x="18" y="58" class="table-field">subscription_status</text>
    <text x="18" y="78" class="table-field">total_cashback_balance</text>
  </g>
  <g transform="translate(375 620)">
    <rect width="245" height="118" class="db"/>
    <text x="18" y="30" class="table-title">waste_submissions</text>
    <text x="18" y="58" class="table-field">waste_type, estimated_weight_kg</text>
    <text x="18" y="78" class="table-field">is_contaminated</text>
    <text x="18" y="98" class="table-field">cashback_amount, status</text>
  </g>
  <g transform="translate(105 755)">
    <rect width="245" height="95" class="db"/>
    <text x="18" y="30" class="table-title">batches</text>
    <text x="18" y="58" class="table-field">total_weight_kg</text>
    <text x="18" y="78" class="table-field">status lifecycle</text>
  </g>
  <g transform="translate(375 755)">
    <rect width="245" height="95" class="db"/>
    <text x="18" y="30" class="table-title">mockup support</text>
    <text x="18" y="58" class="table-field">processors, listings</text>
    <text x="18" y="78" class="table-field">transactions, status_events</text>
  </g>

  <rect x="780" y="535" width="750" height="360" class="box"/>
  <text x="815" y="585" class="box-title">End-to-End Data Flow</text>

  <g transform="translate(815 628)">
    <circle r="22" cx="22" cy="22" class="num-circle"/><text x="16" y="29" class="num">1</text>
    <text x="60" y="19" class="label">B2B user uploads food waste photo</text>
    <text x="60" y="45" class="small">Mobile-first page with demo-safe fallbacks.</text>
  </g>
  <g transform="translate(815 692)">
    <circle r="22" cx="22" cy="22" class="num-circle"/><text x="16" y="29" class="num">2</text>
    <text x="60" y="19" class="label">Vision model classifies waste</text>
    <text x="60" y="45" class="small">Type, weight, confidence, contamination JSON.</text>
  </g>
  <g transform="translate(815 756)">
    <circle r="22" cx="22" cy="22" class="num-circle"/><text x="16" y="29" class="num">3</text>
    <text x="60" y="19" class="label">Submission and cashback are stored</text>
    <text x="60" y="45" class="small">cashback_amount updates business balance.</text>
  </g>
  <g transform="translate(1180 628)">
    <circle r="22" cx="22" cy="22" class="num-circle"/><text x="16" y="29" class="num">4</text>
    <text x="60" y="19" class="label">Pickup batch is created</text>
    <text x="60" y="45" class="small">Status starts as submitted.</text>
  </g>
  <g transform="translate(1180 692)">
    <circle r="22" cx="22" cy="22" class="num-circle"/><text x="16" y="29" class="num">5</text>
    <text x="60" y="19" class="label">Traceability timeline updates</text>
    <text x="60" y="45" class="small">picked_up, processing, completed, sold.</text>
  </g>
  <g transform="translate(1180 756)">
    <circle r="22" cx="22" cy="22" class="num-circle"/><text x="16" y="29" class="num">6</text>
    <text x="60" y="19" class="label">Pages read the operational story</text>
    <text x="60" y="45" class="small">Dashboard, compliance, marketplace, impact.</text>
  </g>

  <path class="arrow" d="M440 305 C510 305 535 305 610 305"/>
  <path class="arrow" d="M985 305 C1058 305 1085 305 1155 305"/>
  <path class="thin-arrow" d="M800 452 C780 505 725 568 650 648"/>
  <path class="thin-arrow" d="M1160 430 C1100 492 1048 542 1010 614"/>
  <path class="thin-arrow" d="M690 780 C725 780 746 780 780 780"/>

  <rect x="82" y="930" width="1428" height="44" rx="22" fill="#ffffff" opacity="0.72" stroke="#bdd3bc"/>
  <text x="115" y="958" class="small">REAL: AI classification, contamination detection, cashback calculation, traceability status. MOCKUP: logistics tracking, marketplace transactions, compliance report export.</text>
</svg>
